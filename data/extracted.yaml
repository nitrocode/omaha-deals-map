- source: visitomaha
  source_record_id: '2729'
  source_url: https://www.visitomaha.com/coupon/say-yes-effortlessly/2729/
  name: Say Yes, Effortlessly
  record_modified_at: '2026-06-02T06:30:43.688Z'
  kind: special
  raw_text: "Your wedding deserves a setting that feels as special as the moment itself.\
    \ At Kimpton Cottonwood Hotel, an AAA Four Diamond, 1916 landmark in Omaha\u2019\
    s Blackstone District, your celebration unfolds in beautifully designed spaces,\
    \ with thoughtful details and a team that takes care of everything behind the\
    \ scenes.\r\n\r\nFor a limited time, enjoy waived room rental for qualifying Friday\
    \ and Sunday weddings in 2026.\r\n\r\nWays We Make It Effortless:\r\n-Waived room\
    \ rental for your ceremony and/or reception\r\n-Dedicated event manager for coordinating\
