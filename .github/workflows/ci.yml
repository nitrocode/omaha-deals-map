name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -m "not slow"
      # Fetches each external resource referenced in site/index.html and
      # verifies its declared SRI hash. Network-dependent (uses unpkg + cdnjs);
      # acceptable in CI since the run is short.
      - name: Verify SRI hashes in site/index.html
        run: python scripts/check_sri.py site/index.html
