name: Form submissions to Issues

# Mirrors anonymous form submissions from the linked Google Sheet into
# GitHub Issues so all contributions (login OR no-login) land in the same
# triage queue. Reads the sheet via Workload Identity Federation so there
# is no static service-account key to manage.

on:
  schedule:
    # Daily at 09:00 UTC (~4am US Central). Keeps the issues list fresh
    # without spamming runs every few minutes.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the high-water-mark state file
  issues: write     # create issues from new rows
  id-token: write   # mint the OIDC token for WIF -> Google Cloud

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHEET_ID: '1iqOxiAEoh9nY5gDtO__PWkPD4hGS7SArmDAO_sS7Z3w'
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/202457150116/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'omaha-deals-sheet-reader@cryptic-net-256222.iam.gserviceaccount.com'
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - run: python scripts/sheet_to_issues.py
      - name: Commit state file if changed
        run: |
          if [ ! -f data/_form_state.json ]; then
            echo "No state file produced (script bailed before writing). Skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_form_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark form submissions as processed" -m "Refs: omaha-deals-map"
            git push
          else
            echo "No state changes this run."
          fi
