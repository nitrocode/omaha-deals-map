name: Integration (slow live tests)

# Runs the `pytest -m slow` suite, which hits real source URLs (growomaha,
# visitomaha, bigdealsmedia) and verifies the parsers still extract expected
# record counts and shapes. The whole point is to surface source schema /
# selector drift BEFORE the Monday weekly-scrape silently 0-records.
#
# Daily at 11:00 UTC (1 hour before the weekly scrape) so a Monday morning
# regression has one shot to fail loudly before the scrape kicks off.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'scripts/_lib/http_cache.py'
      - 'tests/test_*_integration.py'
      - '.github/workflows/integration.yml'

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: Run slow integration tests
        run: pytest -q -m slow
      - name: Smoke test the fetch+parse pipeline end-to-end
        # Belt and suspenders: even if a slow test passes, run the actual
        # _fetch_main.py against live sources and check the summary for
        # zero-record warnings or all-failures.
        run: |
          python scripts/01_fetch.py --force
          python scripts/02_parse.py --force
          python -c "
          import sys, yaml
          summary = yaml.safe_load(open('data/fetch_summary.yaml'))
          warns = [n for n, v in summary.items() if v.get('stale_data_warning')]
          fails = [n for n, v in summary.items() if not v.get('ok')]
          if warns: print(f'::warning::zero-record sources: {warns}')
          if fails: print(f'::error::failed sources: {fails}')
          sys.exit(1 if (warns or fails) else 0)
          "
