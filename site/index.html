<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2c5aa0">
    <title>Omaha Deals Map</title>
    <style>
        :root { font-family: system-ui, -apple-system, sans-serif; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #2c5aa0, #1a3a6e);

            padding: 1rem;
            text-align: center;
        }
        h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); margin: 0 0 .5rem; }
        p { opacity: .85; margin: .25rem 0; max-width: 32rem; }
        code { background: rgba(0,0,0,.25); padding: .15em .4em; border-radius: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Omaha Deals Map</h1>
