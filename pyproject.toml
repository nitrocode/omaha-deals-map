[project]
name = "omaha-deals-map"
version = "0.1.0"
description = "Mobile-first map of Omaha restaurant happy hours, specials, and vouchers."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    # Used only by scripts/sheet_to_issues.py (CI form-mirror job). Local
    # dev needs them installed to run the script ad-hoc; the pipeline
    # itself doesn't import google.
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
]

# Manual one-off scripts that require a headless browser (Playwright +
# Chromium download, ~150MB). Kept out of `dev` so CI installs stay
# lean. Install locally with `pip install -e ".[oneoff]"` then
# `playwright install chromium` once.
oneoff = [
    "playwright>=1.40",
]

[tool.coverage.run]
source = ["sources", "scripts"]
# Numbered CLI stubs are intentionally tiny argparse wrappers around the
# `_*_main.py` modules that hold the real logic and are tested directly.
# Excluding them keeps the headline coverage number honest.
omit = [
    "scripts/01_fetch.py",
    "scripts/02_parse.py",
    "scripts/03_extract_times.py",
    "scripts/04_geocode.py",
    "scripts/05_build.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sources*", "scripts*"]
exclude = ["site*", "data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that hit live external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert False` in tests
